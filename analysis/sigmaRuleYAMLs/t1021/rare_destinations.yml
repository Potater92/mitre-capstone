title: Rarely Seen Destination
name: lanl_rare_destination
status: experimental
logsource:
  product: lanl
  category: authentication
detection:
  selection:
    LogonType: Network
    Orientation: LogOn
    Outcome: Success
    PriorPairCount|lte: 2        # new pair, or seen at most twice before
  filter_machine_and_anonymous:
    User|startswith:
      - C
      - ANONYMOUS
  filter_known_scanners:
      # Identified from BEHAVIOR (same 95 hosts in every 5-minute window all
      # day), not from redteam.txt. Add other automated accounts the same way.
      User:
        - U66@DOM1
  condition: selection and not filter_machine_and_anonymous and not filter_known_scanners
tags:
  - attack.lateral_movement
  - attack.t1021